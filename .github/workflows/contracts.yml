name: Smart Contract CI

on:
  pull_request:
    paths:
      - 'app/blockchain/**'
      - '.github/workflows/contracts.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/blockchain/**'

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry Checks
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: app/blockchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show Foundry version
        run: forge --version

      - name: Run Forge format check
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: check
    
    defaults:
      run:
        working-directory: app/blockchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run unit tests
        run: forge test --match-path "test/unit/**/*.sol" -vvv

      - name: Run fuzz tests
        run: forge test --match-path "test/fuzz/**/*.sol" -vvv

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: test
    
    defaults:
      run:
        working-directory: app/blockchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run coverage
        run: forge coverage --report summary

      - name: Generate coverage report
        run: forge coverage --report lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: app/blockchain/lcov.info
          flags: smart-contracts
          name: smart-contracts-coverage

  gas-report:
    name: Gas Report
    runs-on: ubuntu-latest
    needs: test
    
    defaults:
      run:
        working-directory: app/blockchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Generate gas report
        run: forge test --gas-report > gas-report.txt

      - name: Upload gas report
        uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: app/blockchain/gas-report.txt
          retention-days: 30
