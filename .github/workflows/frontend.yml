name: Frontend CI

on:
  pull_request:
    paths:
      - 'app/web-app/**'
      - '.github/workflows/frontend.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/web-app/**'

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: app/web-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format -- --check

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: app/web-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check]
    
    defaults:
      run:
        working-directory: app/web-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env file
        run: |
          cat > .env << EOF
          NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=test
          NEXTAUTH_SECRET=test-secret-key-for-ci
          NEXTAUTH_URL=http://localhost:3000
          NEXT_PUBLIC_WEBSITE_URL=http://localhost:3000
          POSTGRES_PRISMA_URL=postgres://test:test@localhost:5432/test
          POSTGRES_URL_NON_POOLING=postgres://test:test@localhost:5432/test
          NEXT_PUBLIC_NETWORK=foundry
          EOF

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build
        env:
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: app/web-app/.next
          retention-days: 7
